apiVersion: v1
kind: Namespace
metadata:
  name: h05-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: h05
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: h05-a
data:
  key: value
---
apiVersion: v1
kind: Pod
metadata:
  name: reader
  namespace: h05
spec:
  containers:
    - name: app
      image: busybox
      command: ["sleep", "60"]
      volumeMounts:
        - name: cfg
          mountPath: /cfg
  volumes:
    - name: cfg
      configMap:
        name: settings

# Reproduces the quota incident: the Job wants 2 pods, the quota allows 1.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-resources
  namespace: demo
spec:
  hard:
    pods: "1"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: es-cronjob
  namespace: demo
spec:
  parallelism: 2
  completions: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: es
          image: busybox
          command: ["sleep", "120"]
